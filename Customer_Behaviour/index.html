<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Customer Behaviour Prediction</title>

    <style>

        body{
            background:#e8f5e9;
            font-family:Arial;
            margin:0;
            padding:0;
        }

        .container{

            width:700px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);

        }

        h1{

            text-align:center;
            color:green;

        }

        input{

            width:100%;
            padding:10px;
            margin-top:8px;
            margin-bottom:15px;

        }

        button{

            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            font-size:18px;

        }

        button:hover{

            background:darkgreen;

        }

        h2{

            text-align:center;
            color:blue;

        }

    </style>

</head>

<body>

<div class="container">

<h1>Customer Behaviour Prediction</h1>

<form action="/predict" method="POST">

<input type="number" step="any" name="Age" placeholder="Age" required>

<input type="number" step="any" name="Gender" placeholder="Gender (Encoded)" required>

<input type="number" step="any" name="Annual_Income" placeholder="Annual Income" required>

<input type="number" step="any" name="Total_Spent" placeholder="Total Spent" required>

<input type="number" step="any" name="Items_Purchased" placeholder="Items Purchased" required>

<input type="number" step="any" name="Average_Rating" placeholder="Average Rating" required>

<input type="number" step="any" name="Discount_Applied" placeholder="Discount Applied" required>

<input type="number" step="any" name="Days_Since_Last_Purchase" placeholder="Days Since Last Purchase" required>

<input type="number" step="any" name="Satisfaction_Level" placeholder="Satisfaction Level" required>

<input type="number" step="any" name="Product_Category" placeholder="Product Category (Encoded)" required>

<input type="number" step="any" name="Payment_Method" placeholder="Payment Method (Encoded)" required>

<input type="number" step="any" name="City" placeholder="City (Encoded)" required>

<input type="number" step="any" name="Device_Type" placeholder="Device Type (Encoded)" required>

<button type="submit">
Predict
</button>

</form>

{% if prediction_text %}

<h2>{{ prediction_text }}</h2>

{% endif %}

</div>

</body>

</html>
